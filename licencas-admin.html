<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4A148C">
    <title>Controle de Licenças</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <style>
        :root {--cor-principal:#4A148C; --cor-principal-clara:#7B1FA2; --cor-sucesso:#2E7D32; --cor-vencido:#C62828; --cor-alerta:#F57F17; --cor-fundo:#f4f6fb; --cor-texto:#1e293b; --cor-borda:#e2e8f0;}
        * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Roboto, sans-serif;}
        body {background:var(--cor-fundo); color:var(--cor-texto); padding-bottom:60px; line-height:1.6;}
        .oculto {display:none;}
        .card {background:#fff; border-radius:16px; padding:20px; margin:12px 15px; box-shadow:0 2px 12px rgba(0,0,0,0.06); border:1px solid var(--cor-borda);}
        .tela-login {position:fixed; inset:0; z-index:900; background:linear-gradient(135deg,#4A148C,#7B1FA2); display:flex; align-items:center; justify-content:center; padding:24px;}
        .tela-login.oculto {display:none;}
        .caixa-login {background:#fff; border-radius:20px; padding:32px 24px; max-width:380px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.3);}
        .caixa-login h1 {font-size:20px; font-weight:800; color:var(--cor-principal); text-align:center; margin-bottom:4px;}
        .caixa-login p {text-align:center; color:#64748b; font-size:13px; margin-bottom:20px;}
        .caixa-login input {width:100%; padding:13px; margin-bottom:12px; border:1.5px solid var(--cor-borda); border-radius:10px; font-size:15px;}
        .erro-login {color:#C62828; font-size:13px; text-align:center; min-height:18px; margin-bottom:6px;}
        input,select {width:100%; padding:13px; margin:6px 0; border:1px solid #cbd5e1; border-radius:10px; font-size:15px; background:#fbfcfe;}
        input:focus,select:focus {outline:none; border-color:var(--cor-principal); background:white;}
        label.campo {font-size:12px; font-weight:600; color:#64748b; margin:4px 2px -2px; display:block;}
        .linha {display:flex; gap:12px; flex-wrap:wrap;}
        .col {flex:1; min-width:140px;}
        .btn {border-radius:10px; padding:14px; font-weight:600; border:none; cursor:pointer; width:100%; font-size:15px; margin:5px 0;}
        .btn:active {transform:scale(0.98);}
        .btn-sucesso {background:linear-gradient(135deg,#2E7D32,#388E3C); color:white;}
        .btn-principal {background:linear-gradient(135deg,#4A148C,#7B1FA2); color:white;}
        .btn-alerta {background:linear-gradient(135deg,#F57F17,#FB8C00); color:white;}
        .btn-perigo {background:linear-gradient(135deg,#C62828,#D32F2F); color:white;}
        .btn-cancelar {background:#e2e8f0; color:#334155;}
        .btn[disabled] {opacity:0.6; cursor:not-allowed;}
        header {background:linear-gradient(135deg,#4A148C,#7B1FA2); color:white; padding:18px 15px; position:sticky; top:0; z-index:100; display:flex; justify-content:space-between; align-items:center;}
        .vazio {text-align:center; padding:30px 10px; color:#94a3b8;}
        .selo {padding:4px 12px; border-radius:20px; font-size:12px; font-weight:700; display:inline-block;}
        .selo-ativa {background:#e6f4ea; color:#2E7D32;}
        .selo-vencida {background:#fdecea; color:#C62828;}
        .selo-bloqueada {background:#f1f5f9; color:#64748b;}
        .detalhe {font-size:13px; color:#64748b; margin-top:2px;}
        #toasts {position:fixed; bottom:20px; left:0; right:0; z-index:300; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
        .toast {min-width:220px; max-width:90%; background:#1e293b; color:#fff; padding:14px 20px; border-radius:12px; font-size:14px; font-weight:600; box-shadow:0 4px 20px rgba(0,0,0,0.25); opacity:0; transform:translateY(20px); transition:0.25s;}
        .toast.mostrar {opacity:1; transform:translateY(0);}
        .toast.sucesso {background:linear-gradient(135deg,#2E7D32,#388E3C);}
        .toast.erro {background:linear-gradient(135deg,#C62828,#D32F2F);}
        .toast.info {background:linear-gradient(135deg,#4A148C,#7B1FA2);}
    </style>
</head>
<body>
<div class="tela-login" id="telaLogin">
    <div class="caixa-login">
        <h1>🔑 CONTROLE DE LICENÇAS</h1>
        <p>Acesso restrito ao administrador</p>
        <div class="erro-login" id="erroLogin"></div>
        <input type="email" id="login-email" placeholder="E-mail" autocomplete="username">
        <input type="password" id="login-senha" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter') fazerLogin()">
        <button class="btn btn-principal" onclick="fazerLogin()" id="btn-login">Entrar</button>
    </div>
</div>

<div id="appConteudo" class="oculto">
<div id="toasts"></div>
<header>
    <div>
        <div style="font-weight:700; font-size:18px;">🔑 Controle de Licenças</div>
        <div style="font-size:12px; opacity:0.9;">Painel do administrador</div>
    </div>
    <button class="btn btn-cancelar" style="width:auto; margin:0; padding:8px 14px; font-size:13px;" onclick="sair()">Sair</button>
</header>

<div class="card">
    <h3 style="font-weight:700; margin-bottom:10px;">➕ Cadastrar nova loja</h3>
    <label class="campo">Código da loja (sem espaço, ex: rn-modas)</label>
    <input type="text" id="nova-loja-id" placeholder="codigo-da-loja">
    <label class="campo">Nome da loja</label>
    <input type="text" id="nova-loja-nome" placeholder="Ex: R.N Modas">
    <label class="campo">Licença válida por quantos dias a partir de hoje?</label>
    <input type="number" id="nova-loja-dias" value="30" min="1">
    <button class="btn btn-sucesso" onclick="cadastrarLoja()" id="btn-cadastrar-loja">✅ Cadastrar loja</button>
</div>

<div class="card">
    <h3 style="font-weight:700; margin-bottom:6px;">🏪 Lojas cadastradas</h3>
    <p class="detalhe" style="margin-bottom:10px;">Toque em "Renovar" quando a loja pagar a licença. Toque em "Bloquear" para suspender o acesso a qualquer momento.</p>
    <div id="lista-lojas"></div>
</div>
</div>

<script>
// ⚠️ PREENCHA com a config do projeto Firebase CENTRAL de licenças (crie um projeto
// novo e separado dos projetos das lojas — este é só seu, do administrador).
const firebaseConfig = {
    apiKey: "",
    authDomain: "",
    projectId: "",
    storageBucket: "",
    messagingSenderId: "",
    appId: ""
};

let db = null;
try {
    if (typeof firebase !== 'undefined' && firebaseConfig.apiKey) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
    }
} catch(e) { db = null; }

function mostrarToast(msg, tipo='sucesso'){
    let el = document.createElement('div');
    el.className = `toast ${tipo}`;
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    requestAnimationFrame(()=>el.classList.add('mostrar'));
    setTimeout(()=>{ el.classList.remove('mostrar'); setTimeout(()=>el.remove(), 300); }, 3500);
}

function hojeISO(){
    let d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0,10);
}

function somarDias(dataISO, dias){
    let d = new Date(dataISO+'T00:00:00');
    d.setDate(d.getDate() + dias);
    return d.toISOString().slice(0,10);
}

// ---------- Login ----------
function fazerLogin(){
    let email = document.getElementById('login-email').value.trim();
    let senha = document.getElementById('login-senha').value;
    let erroEl = document.getElementById('erroLogin');
    erroEl.textContent = '';
    if(!email || !senha){ erroEl.textContent = 'Preencha e-mail e senha.'; return; }
    if(!firebaseConfig.apiKey){ erroEl.textContent = 'Este painel ainda não foi configurado (falta o Firebase central). Avise o suporte.'; return; }
    let btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = 'Entrando...';
    firebase.auth().signInWithEmailAndPassword(email, senha)
        .catch(e=>{
            let msgs = {
                'auth/invalid-email':'E-mail inválido.',
                'auth/user-not-found':'Não existe login com esse e-mail.',
                'auth/wrong-password':'Senha incorreta.',
                'auth/invalid-credential':'E-mail ou senha incorretos.',
                'auth/too-many-requests':'Muitas tentativas erradas. Espere um pouco e tente de novo.'
            };
            erroEl.textContent = msgs[e.code] || 'Não foi possível entrar. Tente novamente.';
        })
        .finally(()=>{ btn.disabled = false; btn.textContent = 'Entrar'; });
}

function sair(){ if(firebase.auth) firebase.auth().signOut(); }

if (typeof firebase !== 'undefined' && firebaseConfig.apiKey) {
    firebase.auth().onAuthStateChanged(user=>{
        if(user){
            document.getElementById('telaLogin').classList.add('oculto');
            document.getElementById('appConteudo').classList.remove('oculto');
            iniciarPainel();
        } else {
            document.getElementById('appConteudo').classList.add('oculto');
            document.getElementById('telaLogin').classList.remove('oculto');
        }
    });
}

// ---------- Painel de lojas ----------
let lojas = [];

function iniciarPainel(){
    if(!db) return;
    db.collection('licencas').onSnapshot(snap=>{
        lojas = [];
        snap.forEach(doc=> lojas.push({ id: doc.id, ...doc.data() }));
        lojas.sort((a,b)=> (a.nome||'').localeCompare(b.nome||''));
        renderizarLojas();
    }, erro=>{
        mostrarToast('Sem conexão com o servidor de licenças.', 'erro');
    });
}

function cadastrarLoja(){
    let id = document.getElementById('nova-loja-id').value.trim().toLowerCase().replace(/\s+/g,'-');
    let nome = document.getElementById('nova-loja-nome').value.trim();
    let dias = Number(document.getElementById('nova-loja-dias').value) || 30;

    if(!id) return mostrarToast('Informe o código da loja.', 'erro');
    if(!nome) return mostrarToast('Informe o nome da loja.', 'erro');
    if(lojas.some(l=>l.id===id)) return mostrarToast('Já existe uma loja com esse código.', 'erro');

    let btn = document.getElementById('btn-cadastrar-loja');
    btn.disabled = true; btn.textContent = 'Cadastrando...';

    let vencimento = somarDias(hojeISO(), dias);
    db.collection('licencas').doc(id).set({
        nome: nome,
        ativa: true,
        vencimento: vencimento,
        criadoEm: hojeISO()
    }).then(()=>{
        mostrarToast(`Loja "${nome}" cadastrada! Licença válida até ${new Date(vencimento+'T00:00:00').toLocaleDateString('pt-BR')}.`, 'sucesso');
        document.getElementById('nova-loja-id').value = '';
        document.getElementById('nova-loja-nome').value = '';
        document.getElementById('nova-loja-dias').value = 30;
    }).catch(()=>{
        mostrarToast('Erro ao cadastrar. Verifique a internet e tente de novo.', 'erro');
    }).finally(()=>{
        btn.disabled = false; btn.textContent = '✅ Cadastrar loja';
    });
}

function renovarLoja(id, dias){
    let loja = lojas.find(l=>l.id===id);
    if(!loja) return;
    // Renova a partir de hoje, ou do vencimento atual se ele ainda não passou (não perde dias já pagos)
    let baseData = (loja.vencimento && loja.vencimento > hojeISO()) ? loja.vencimento : hojeISO();
    let novoVencimento = somarDias(baseData, dias);
    db.collection('licencas').doc(id).update({
        ativa: true,
        vencimento: novoVencimento
    }).then(()=>{
        mostrarToast(`Licença renovada até ${new Date(novoVencimento+'T00:00:00').toLocaleDateString('pt-BR')}.`, 'sucesso');
    }).catch(()=> mostrarToast('Erro ao renovar. Tente de novo.', 'erro'));
}

function alternarBloqueio(id, novoEstadoAtiva){
    db.collection('licencas').doc(id).update({ ativa: novoEstadoAtiva }).then(()=>{
        mostrarToast(novoEstadoAtiva ? 'Loja desbloqueada.' : 'Loja bloqueada.', novoEstadoAtiva ? 'sucesso' : 'info');
    }).catch(()=> mostrarToast('Erro ao atualizar. Tente de novo.', 'erro'));
}

function excluirLoja(id){
    if(!confirm('Excluir esta loja do painel de licenças? Isso não apaga os dados da loja, só remove o controle de licença dela.')) return;
    db.collection('licencas').doc(id).delete().then(()=>{
        mostrarToast('Loja removida do painel.', 'info');
    });
}

function renderizarLojas(){
    let lista = document.getElementById('lista-lojas');
    if(lojas.length===0){
        lista.innerHTML = `<div class="vazio">Nenhuma loja cadastrada ainda.</div>`;
        return;
    }
    let hoje = hojeISO();
    lista.innerHTML = lojas.map(l=>{
        let ativa = l.ativa !== false;
        let vencida = l.vencimento && l.vencimento < hoje;
        let status = !ativa ? {classe:'selo-bloqueada', texto:'🚫 Bloqueada'} : vencida ? {classe:'selo-vencida', texto:'⏰ Vencida'} : {classe:'selo-ativa', texto:'✅ Ativa'};
        let vencFmt = l.vencimento ? new Date(l.vencimento+'T00:00:00').toLocaleDateString('pt-BR') : 'sem prazo definido';
        return `
        <div class="card" style="margin:10px 0;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
                <div>
                    <b>${l.nome}</b>
                    <div class="detalhe">Código: ${l.id}</div>
                    <div class="detalhe">Vencimento: ${vencFmt}</div>
                </div>
                <span class="selo ${status.classe}">${status.texto}</span>
            </div>
            <div class="linha mt-2" style="margin-top:10px;">
                <button class="btn btn-sucesso" style="margin:0;" onclick="renovarLoja('${l.id}', 30)">🔄 Renovar +30 dias</button>
                ${ativa
                    ? `<button class="btn btn-alerta" style="margin:0;" onclick="alternarBloqueio('${l.id}', false)">🚫 Bloquear</button>`
                    : `<button class="btn btn-sucesso" style="margin:0;" onclick="alternarBloqueio('${l.id}', true)">🔓 Desbloquear</button>`}
            </div>
            <button class="btn btn-cancelar" style="margin-top:6px;" onclick="excluirLoja('${l.id}')">🗑️ Remover do painel</button>
        </div>`;
    }).join('');
}
</script>
</body>
</html>
